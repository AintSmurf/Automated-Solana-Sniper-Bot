[pytest]
pythonpath = ..
addopts = --strict-markers
log_cli = true
log_cli_level = INFO

filterwarnings=
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning

markers =
    unit: pure unit tests (no network)
    db: database tests (local postgres only)
    integration: local integration tests (no public network)
    devnet: live devnet tests (Helius/Jupiter/wallet)
    smoke: quick canary tests
    network: tests that hit public internet APIs (Jupiter/Helius/etc.)
    scam_service: ScamChecker service tests
    liquidity_service: LiquidityAnalyzer service tests
    trade_manager: TraderManager service tests
    trade_lifecycle_service: TradeLifecycleService service tests